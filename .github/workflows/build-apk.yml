name: Build Android APK (SE SMART CELL)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager was not found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare local build configuration
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          if [[ ! -f .env ]]; then
            cp .env.example .env
          fi
          # Supply your own Firebase config as a GitHub Actions secret when available.
          # Store the complete google-services.json as base64 in FIREBASE_GOOGLE_SERVICES_JSON_B64.
          if [[ -n "${FIREBASE_GOOGLE_SERVICES_JSON_B64:-}" ]]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
          fi
          # Without a Firebase config the APK can compile, but Firebase sign-in/cloud sync
          # will not work until app/google-services.json is added for this app/package.
          if [[ ! -f debug.keystore ]]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK was created
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SE-SMART-CELL-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
